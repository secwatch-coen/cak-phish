<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICTvaardig | Portaal</title>
  <meta name="description"
    content="Log in op het ICTvaardig learning platform voor trainingen, voortgang en certificaten." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ICTvaardig" />
  <link rel="manifest" href="/images/site.webmanifest" />
  <style>
    #lgImg {
      width: 31px;
      height: 31px;
      margin: 0px 5px 0px 0px;
    }
  </style>
</head>

<body class="page-layout">
  <main>
    <section class="shell auth-section">
      <div class="auth-card reveal">
        <div class="auth-grid">
          <aside class="auth-media">
            <div class="auth-media-inner">
              <div class="auth-media-brand">
                <img class="brand-logo" src="images/favicon.svg" alt="ICTvaardig logo" />
                <span>ICTvaardig</span>
              </div>
              <div class="auth-quote">
                <p>“Alles wat mijn team nodig heeft om vaardig te blijven.”</p>
                <span>Karin Yue &middot; Directeur Digitale Innovatie</span>
              </div>
            </div>
          </aside>
          <div class="auth-panel">
            <div class="auth-header">
              <span class="eyebrow">Portaal</span>
              <h2>Welkom terug bij ICTvaardig</h2>
              <p>
                Log in met je organisatie-account om direct verder te gaan met je leerpad.
              </p>
            </div>
            <form class="auth-form">
              <label class="form-field">
                <span>E-mail</span>
                <input type="email" name="email" placeholder="email@organisatie.nl" />
              </label>
              <div class="auth-actions">
                <button class="btn btn-primary" type="button" id="login-btn">Log in</button>
              </div>
              <div class="auth-divider"><span>Of</span></div>
              <button class="btn btn-soft" type="button" id="msf-login-btn"><img id="lgImg" src="images/logo2.svg">SCW1YzMgQnZvN3byNWaNBCdl1GIulGIn9GTE</button>
              <p class="auth-footer">
                Nog geen account? <a class="auth-link" href="#">Neem contact op</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/scw.js"></script>
</body>

</html>
