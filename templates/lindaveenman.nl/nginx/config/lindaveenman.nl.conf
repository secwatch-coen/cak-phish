# ------------------------------
# (www.)domein.nl (landing page)
# ------------------------------
server {
    listen 443 ssl;
    server_name lindaveenman.nl www.lindaveenman.nl;

    root /var/www/html/lindaveenman.nl;
    index index.html;

    # Self signed ssl certs
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Logging
    access_log /var/log/nginx/access.log custom_log;
    error_log  /var/log/nginx/error.log warn;

    # Deny access to hidden files / config / VCS
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Trackingpixel: /img/<uniek-token>
    location /img/ {
        # Transparante 1x1 GIF, automatisch Content-Type: image/gif
        empty_gif;

        # Vraag clients en caches om de response niet te bewaren.
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        # Schakel gebruikelijke cachevalidatie uit.
        etag off;
        if_modified_since off;
    }

    # Overige statische bestanden
    location / {
        try_files $uri $uri/ =404;
    }
}