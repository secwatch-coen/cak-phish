<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linda Veenman</title>
<meta name="description" content="Linda Veenman — schadebehandelaar, fotograaf, reiziger en foodie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F3EFE7; color: #2B2E26; font-family: Karla, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #2B2E26; text-decoration: none; }
  a:hover { color: #8A9478; }
  ::selection { background: #E4DCCD; }

  .page { min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; }

  .intro { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; justify-content: center;
           gap: clamp(24px, 3vw, 36px); padding: clamp(36px, 6vw, 88px); }
  .intro h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300;
              font-size: clamp(54px, 7.5vw, 96px); line-height: 0.88; letter-spacing: -0.015em; }
  .intro h1 em { font-weight: 300; }
  .rule { height: 1px; width: 64px; margin-top: clamp(20px, 3vw, 32px); background: #8A9478; }
  .lead { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300;
          font-size: clamp(21px, 2.4vw, 28px); line-height: 1.45; max-width: 24ch; text-wrap: pretty; }
  .body { margin: 0; font-size: 15px; line-height: 1.8; color: #5E6157; max-width: 34ch; text-wrap: pretty; }
  .tags { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; letter-spacing: 0.2em;
          text-transform: uppercase; color: #5E6157; }
  .tags .sep { color: #D6CEBE; }
  .domain { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #5E6157;
            margin-top: clamp(12px, 4vh, 40px); }

  .gallery { flex: 1.15 1 380px; min-width: 0; min-height: clamp(420px, 70vh, 900px);
             display: flex; flex-direction: column; gap: clamp(8px, 1vw, 14px); padding: clamp(8px, 1vw, 14px); }
  .gallery .row { flex: 1 1 0; min-height: 0; display: flex; gap: clamp(8px, 1vw, 14px); }
  .shot { position: relative; min-height: 0; min-width: 0; overflow: hidden; border-radius: 3px; background: #E4DCCD; }
  .shot.tall { flex: 2.1 1 0; }
  .shot.half { flex: 1 1 0; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { position: absolute; right: 8px; bottom: 7px; font-size: 9px; letter-spacing: 0.06em;
            color: #fff; opacity: 0.72; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  .credit:hover { color: #fff; opacity: 1; }

  @media (max-width: 720px) {
    .gallery { min-height: 0; }
    .shot.tall { aspect-ratio: 4 / 5; flex: none; }
    .gallery .row { flex: none; height: 38vw; min-height: 150px; }
  }
</style>
</head>
<body>
<div class="page">

  <section class="intro">
    <div>
      <h1>Linda<br><em>Veenman</em></h1>
      <div class="rule"></div>
    </div>

    <p class="lead">Dertig jaar. Schadebehandelaar bij een verzekeraar, fotograaf in alle uren daarbuiten.</p>

    <p class="body">Het liefst met een camera onderweg, op zoek naar een nieuwe stad en een goed bord eten.</p>

    <div class="tags">
      <span>Fotografie</span><span class="sep">/</span>
      <span>Reizen</span><span class="sep">/</span>
      <span>Eten</span>
    </div>

    <div class="domain">lindaveenman.nl</div>
  </section>

  <section class="gallery">
    <div class="shot tall">
      <img src="https://images.unsplash.com/photo-1752760437093-bcd023478e6f?fm=jpg&amp;q=80&amp;w=1400&amp;auto=format&amp;fit=crop" alt="Zonnig straatbeeld">
      <a class="credit" href="https://unsplash.com/@nisayum" target="_blank" rel="noreferrer noopener"></a>
    </div>
    <div class="row">
      <div class="shot half">
        <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?fm=jpg&amp;q=80&amp;w=1000&amp;auto=format&amp;fit=crop" alt="Camera en reisspullen">
        <a class="credit" href="https://unsplash.com/@anniespratt" target="_blank" rel="noreferrer noopener"></a>
      </div>
      <div class="shot half">
        <img src="https://images.unsplash.com/photo-1466337105551-aa3ab7890939?fm=jpg&amp;q=80&amp;w=1000&amp;auto=format&amp;fit=crop" alt="Cappuccino met gebak">
        <a class="credit" href="https://unsplash.com/@jeztimms" target="_blank" rel="noreferrer noopener"></a>
      </div>
    </div>
  </section>

</div>
</body>
</html>
